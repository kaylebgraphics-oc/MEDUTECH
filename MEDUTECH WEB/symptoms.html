<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f4ee">
<title>MEDUTECH — Symptom checker</title><link rel="icon" href="assets/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/hub.css"><link rel="stylesheet" href="css/pro.css"><script src="js/prefs.js"></script></head><body data-page="symptoms">
<main class="wrap page"><section class="top"><h1 data-t="sym_h"></h1><p data-t="sym_p"></p></section>
<div class="steps"><div class="st on"><b>1</b><span>Symptoms</span></div><u></u><div class="st"><b>2</b><span>Details</span></div><u></u><div class="st"><b>3</b><span>Results</span></div></div>
<section class="glass card pane" id="p1"><h3>What are you feeling?</h3><input id="q" type="search" placeholder="Search 230+ symptoms, e.g. fever, rash, cough" autocomplete="off"><div class="cats" id="cats"></div><div class="chips2" id="sy"></div>
<div class="other"><label for="oth">Not in the list? Add your own symptom</label><div class="oform"><input id="oth" maxlength="60" placeholder="Type it in your own words, e.g. burning feet at night" autocomplete="off"><button class="btn ghost" id="oa" type="button">Add symptom</button></div><p class="hint" id="om" role="status"></p></div></section>
<section class="glass card pane" id="p2" hidden><h3>Your symptoms</h3><div class="tray" id="tray"></div><div class="two"><div><label for="sw">Who is this for?</label><select id="sw"><option>Myself</option><option>A child</option><option>Someone pregnant</option><option>An older adult</option></select></div><div><label for="sl">For how long?</label><select id="sl"><option>Started today</option><option>2 to 3 days</option><option>About a week</option><option>More than 2 weeks</option></select></div></div><label for="sv" style="margin-top:1rem">How bad is it?</label><select id="sv"><option>Mild</option><option>Moderate</option><option>Severe</option></select><label for="xt" style="margin-top:1rem">Anything else? (optional)</label><textarea id="xt" rows="3" placeholder="Describe it in your own words. Matching symptoms are added for you."></textarea></section>
<section id="p3" hidden></section>
<div class="actbar" id="ab"><span id="cn">Select at least one symptom</span><button class="btn ghost" id="bk" hidden>Back</button><button class="btn" id="nx" disabled>Next &rarr;</button></div></main>
<script src="js/i18n.js"></script><script src="js/shell.js"></script><script src="js/symdata.js"></script><script src="js/symptoms.js"></script><script src="js/translate.js"></script></body></html>
